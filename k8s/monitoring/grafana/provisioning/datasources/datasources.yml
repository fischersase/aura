apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: ${PROMETHEUS_URL}
    isDefault: true
    editable: false

  - name: Aura Postgres
    uid: postgres
    type: postgres
    access: proxy
    url: ${GRAFANA_DB_URL}
    database: ${GRAFANA_DB_NAME}
    user: ${GRAFANA_DB_USER}
    secureJsonData:
      password: ${GRAFANA_DB_PASSWORD}
    jsonData:
      sslmode: ${GRAFANA_DB_SSLMODE}
      postgresVersion: 1600
      timescaledb: false
    editable: false
