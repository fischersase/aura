# Suffigierte In-Namespace Service-Namen & Prod-Umgebung (vermeidet den Kustomize nameSuffix-Fallstrick).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
spec:
  template:
    spec:
      containers:
        - name: frontend
          env:
            - name: BACKEND_UPSTREAM
              value: "backend-service-prod:3001"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
spec:
  template:
    spec:
      containers:
        - name: backend
          env:
            - name: AURA_ENV
              value: "production"
            - name: GRAFANA_PUBLIC_URL
              value: "http://grafana-aura-prod.local"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
spec:
  template:
    spec:
      containers:
        - name: grafana
          env:
            - name: PROMETHEUS_URL
              value: "http://prometheus-prod:9090"
            - name: GRAFANA_DB_URL
              value: "postgres-service-prod:5432"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-exporter
spec:
  template:
    spec:
      containers:
        - name: postgres-exporter
          env:
            - name: DATA_SOURCE_URI
              value: "postgres-service-prod:5432/aura_admin?sslmode=disable"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
spec:
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: backup
              env:
                - name: PGHOST
                  value: "postgres-service-prod"
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aura-admin-ingress
spec:
  rules:
    - host: aura-admin-prod.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana-ingress
spec:
  rules:
    - host: grafana-aura-prod.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  number: 3000
