global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: aura-admin-backend
    metrics_path: /metrics
    static_configs:
      - targets: ['backend:3001']
  - job_name: postgres-exporter
    metrics_path: /metrics
    scrape_interval: 30s
    static_configs:
      - targets: ['postgres-exporter:9187']
