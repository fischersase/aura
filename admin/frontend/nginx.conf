# Unprivileged nginx für Aura Admin Console (identisch zu Headhunter frontend-service:80 -> pod:8080).
# Proxyt /api/* an backend-service:3001; /metrics bleibt bewusst NICHT öffentlich exponiert!
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Sicherheits-Header
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Blockiere /metrics über die öffentliche Tür (nur Prometheus clusterintern erlaubt)
    location = /metrics {
        return 404;
    }

    location /api/ {
        proxy_pass http://${BACKEND_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
