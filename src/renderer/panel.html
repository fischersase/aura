<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark light">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' blob: mediastream:; connect-src 'none'; worker-src 'self' blob:">
<title>Aura</title>
<link rel="stylesheet" href="panel.css">
</head>
<body>
<div id="card" class="card hidden">
  <div class="sheen"></div>

  <!-- Minimierte Leiste in der unteren rechten Ecke -->
  <div id="minimizedBar" class="min-bar">
    <button type="button" id="restoreBtn" class="min-main" title="Chat öffnen (Strg+Leertaste)">
      <svg class="spark" viewBox="0 0 24 24"><use href="#spark"/></svg>
      <span id="minTitle" class="min-title">Aura · Weiterfragen …</span>
      <svg class="min-expand" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 14l5-5 5 5"/></svg>
    </button>
    <button type="button" id="minCloseBtn" class="icon min-close" title="Ganz schließen"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>

  <!-- Chat -->
  <section id="chatView">
    <header id="chatHeader">
      <span class="brand"><svg class="spark" viewBox="0 0 24 24"><use href="#spark"/></svg>Aura<span id="appVer" class="ver" title="Installierte Version"></span></span>
      <span class="spacer"></span>
      <button id="openZentrale" class="icon" title="Aura anpassen: Connectors, Skills &amp; Zentrale"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/></svg></button>
      <button id="newChat" class="icon" title="Neuer Chat"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
      <button id="sizeBtn" class="icon" title="Größer"><svg viewBox="0 0 24 24"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg></button>
      <button id="openSettings" class="icon" title="Einstellungen"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
      <button id="minimizeBtn" class="icon" title="Minimieren (unten rechts anheften)"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
      <button id="closeBtn" class="icon" title="Schließen"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </header>
    <div id="inbox" class="hidden" aria-live="polite"></div>
    <div id="messages"></div>
    <div id="resizeGrip" title="Ziehen, um die Größe zu ändern"></div>
    <form id="composer" autocomplete="off">
      <textarea id="input" rows="1" placeholder="Aura fragen"></textarea>
      <div class="tools">
        <button type="button" id="screenToggle" class="chip" title="Bildschirm mitschicken">
          <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg><span>Bildschirm</span>
        </button>
        <button type="button" id="incognitoBtn" class="chip icon-chip" title="Inkognito: Aura merkt sich aus diesem Chat nichts und speichert ihn nicht">
          <svg viewBox="0 0 24 24"><path d="M3 3l18 18"/><path d="M10.6 5.1A10 10 0 0 1 12 5c5 0 9 4.5 10 7a13 13 0 0 1-3 4M6.6 6.6C4.4 8 2.9 10 2 12c1 2.5 5 7 10 7a9.6 9.6 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
        </button>
        <button type="button" id="historyBtn" class="chip icon-chip" title="Frühere Chats">
          <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></svg>
        </button>
        <span class="spacer"></span>
        <span id="recInfo" class="rec-info hidden" aria-live="polite"></span>
        <button type="button" id="cost" class="cost"><span>…</span><b><i></i></b></button>
        <button type="button" id="micBtn" class="mic-btn" title="Spracheingabe: sprechen, dann nochmal drücken zum Senden">
          <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
        </button>
        <button type="button" id="liveBtn" class="live-btn" title="Live">
          <svg viewBox="0 0 24 24"><path d="M4 10v4M8 7v10M12 4v16M16 7v10M20 10v4"/></svg>
        </button>
        <button type="submit" id="sendBtn" class="send-btn" title="Senden" disabled>
          <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
      </div>
    </form>
  </section>

  <!-- Frühere Chats -->
  <section id="historyView" class="hidden">
    <header>
      <button id="historyBack" class="icon" title="Zurück"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
      <span class="brand">Frühere Chats</span>
      <span class="spacer"></span>
      <button id="historyClose" class="icon" title="Schließen (Esc)"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </header>
    <div id="historyList"></div>
  </section>

  <!-- Live -->
  <section id="liveView" class="hidden">
    <div class="live-top">
      <span class="live-badge"><i></i>Live</span>
      <span id="liveStatus" class="live-status">Verbinde …</span>
    </div>
    <div class="orb-wrap"><div id="orb" class="orb"><b></b><b></b><b></b><b></b></div></div>
    <div id="liveTranscript" class="live-transcript"></div>
    <div class="live-controls">
      <button id="liveScreen" class="round on" title="Bildschirmfreigabe an/aus">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>
      </button>
      <button id="liveMute" class="round" title="Mikrofon stumm">
        <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      </button>
      <button id="liveEnd" class="round end" title="Live beenden">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
  </section>
</div>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4285F4"/><stop offset=".55" stop-color="#9B72CB"/><stop offset="1" stop-color="#D96570"/>
    </linearGradient>
    <symbol id="spark" viewBox="0 0 24 24"><path fill="url(#g)" d="M12 2c.6 5.3 4.7 9.4 10 10-5.3.6-9.4 4.7-10 10-.6-5.3-4.7-9.4-10-10 5.3-.6 9.4-4.7 10-10z"/></symbol>
  </defs>
</svg>

<script src="screen-grab.js"></script>
<script src="audio.js"></script>
<script src="live.js"></script>
<script src="local-live.js"></script>
<script src="panel.js"></script>
</body>
</html>
