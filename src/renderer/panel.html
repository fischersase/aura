<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' blob: mediastream:; connect-src wss://generativelanguage.googleapis.com https://generativelanguage.googleapis.com; worker-src 'self' blob:">
<title>Aura</title>
<link rel="stylesheet" href="panel.css">
</head>
<body>
<div id="card" class="card hidden">
  <div class="sheen"></div>

  <!-- Chat -->
  <section id="chatView">
    <header id="chatHeader">
      <span class="brand"><svg class="spark" viewBox="0 0 24 24"><use href="#spark"/></svg>Aura</span>
      <span class="spacer"></span>
      <button id="newChat" class="icon" title="Neuer Chat"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
      <button id="openSettings" class="icon" title="Einstellungen"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
      <button id="closeBtn" class="icon" title="Schließen (Esc)"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </header>
    <div id="messages"></div>
    <form id="composer" autocomplete="off">
      <textarea id="input" rows="1" placeholder="Aura fragen"></textarea>
      <div class="tools">
        <button type="button" id="screenToggle" class="chip" title="Bildschirm mitschicken">
          <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg><span>Bildschirm</span>
        </button>
        <span class="spacer"></span>
        <button type="button" id="cost" class="cost"><span>…</span><b><i></i></b></button>
        <button type="button" id="liveBtn" class="live-btn" title="Live">
          <svg viewBox="0 0 24 24"><path d="M4 10v4M8 7v10M12 4v16M16 7v10M20 10v4"/></svg>
        </button>
        <button type="submit" id="sendBtn" class="send-btn" title="Senden" disabled>
          <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
      </div>
    </form>
  </section>

  <!-- Live -->
  <section id="liveView" class="hidden">
    <div class="live-top">
      <span class="live-badge"><i></i>Live</span>
      <span id="liveStatus" class="live-status">Verbinde …</span>
    </div>
    <div class="orb-wrap"><div id="orb" class="orb"><b></b><b></b><b></b><b></b></div></div>
    <div id="liveTranscript" class="live-transcript"></div>
    <div class="live-controls">
      <button id="liveScreen" class="round on" title="Bildschirmfreigabe an/aus">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>
      </button>
      <button id="liveMute" class="round" title="Mikrofon stumm">
        <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      </button>
      <button id="liveEnd" class="round end" title="Live beenden">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
  </section>
</div>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4285F4"/><stop offset=".55" stop-color="#9B72CB"/><stop offset="1" stop-color="#D96570"/>
    </linearGradient>
    <symbol id="spark" viewBox="0 0 24 24"><path fill="url(#g)" d="M12 2c.6 5.3 4.7 9.4 10 10-5.3.6-9.4 4.7-10 10-.6-5.3-4.7-9.4-10-10 5.3-.6 9.4-4.7 10-10z"/></symbol>
  </defs>
</svg>

<script src="audio.js"></script>
<script src="live.js"></script>
<script src="local-live.js"></script>
<script src="panel.js"></script>
</body>
</html>
