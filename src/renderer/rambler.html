<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:">
<title>Rambler</title>
<style>
  :root { --bg: rgba(30,31,32,.95); --text: #e3e3e3; --muted: #a8abb0; --spring: cubic-bezier(.34,1.56,.64,1);
    font-family: "Google Sans", "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; }
  @media (prefers-color-scheme: light) { :root { --bg: rgba(248,250,253,.96); --text: #1f1f1f; --muted: #5f6368; } }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; color: var(--text); user-select: none; }
  .bar {
    position: absolute; left: 12px; right: 12px; top: 10px; height: 56px; border-radius: 28px;
    background: var(--bg); display: flex; align-items: center; gap: 10px; padding: 0 8px 0 16px;
    box-shadow: 0 8px 28px rgba(0,0,0,.35); animation: barIn .45s var(--spring) both;
  }
  .bar::before {
    content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1.5px; pointer-events: none;
    background: conic-gradient(from var(--a), #4285F4, #9B72CB, #EA4335, #FBBC04, #34A853, #4285F4);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude;
    animation: spin 3s linear infinite;
  }
  @property --a { syntax: '<angle>'; initial-value: 0deg; inherits: false; }
  @keyframes spin { to { --a: 360deg; } }
  @keyframes barIn { from { transform: translateY(16px) scale(.6); opacity: 0; } }
  .bar.out { animation: barOut .2s ease-in forwards; }
  @keyframes barOut { to { transform: translateY(10px) scale(.9); opacity: 0; } }
  .wave { display: flex; align-items: center; gap: 3px; height: 28px; width: 46px; }
  .wave i { flex: 1; border-radius: 2px; height: 4px; background: linear-gradient(#4285F4, #9B72CB); transition: height .08s linear; }
  .label { flex: 1; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .label small { color: var(--muted); font-size: 12px; margin-left: 6px; }
  button { font: inherit; font-size: 13px; color: var(--text); border: 0; cursor: pointer; border-radius: 18px; padding: 8px 12px; background: rgba(255,255,255,.08); }
  @media (prefers-color-scheme: light) { button { background: rgba(0,0,0,.06); } }
  button:hover { filter: brightness(1.2); }
  button.primary { background: #4285F4; color: #fff; }
  .icon { width: 36px; height: 36px; padding: 0; display: grid; place-items: center; }
  .icon svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
  .shimmer { background: linear-gradient(90deg, var(--muted) 0%, var(--text) 40%, var(--muted) 80%); background-size: 200% 100%;
    -webkit-background-clip: text; color: transparent; animation: shim 1.4s linear infinite; }
  @keyframes shim { from { background-position: 200% 0; } to { background-position: 0 0; } }
  .hidden { display: none !important; }
  .err { color: #f28b82; }
</style>
</head>
<body>
<div id="bar" class="bar hidden">
  <div id="wave" class="wave"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <div id="label" class="label">Rambler hört zu …</div>
  <button id="cancel" class="icon" title="Abbrechen"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  <button id="stop" class="primary" title="Fertig">Fertig</button>
  <button id="undo" class="hidden">Rückgängig</button>
  <button id="full" class="hidden" title="Unbearbeitetes Transkript einfügen">Volltranskript</button>
</div>
<script src="audio.js"></script>
<script src="rambler.js"></script>
</body>
</html>
