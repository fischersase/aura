# Gruppen für die automatisch erzeugten Release-Notizen
changelog:
  exclude:
    labels: [skip-changelog]
  categories:
    - title: New
      labels: [enhancement, feature]
    - title: Fixes
      labels: [bug]
    - title: Security
      labels: [security]
    - title: Dependencies
      labels: [dependencies]
    - title: Other changes
      labels: ['*']
