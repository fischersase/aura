name: Feature request
description: An idea for Aura
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the task or problem, not only the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could Aura help?
  - type: textarea
    id: safety
    attributes:
      label: Safety
      description: Would this let Aura change, send or delete something? How should it ask?
