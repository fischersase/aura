name: Windows-Installer
# Baut auf Pull Requests und Nicht-main-Branches (und auf Knopfdruck) den Windows-Installer mit Agent v2,
# installiert ihn still, prüft den installierten Agenten und legt den Installer als Artefakt „Aura-Setup“ ab.
on:
  push:
    branches-ignore: [main]
    paths: ['src/**', 'assets/**', 'scripts/**', 'agent/src/**', 'agent/pyproject.toml', 'agent/uv.lock', 'package.json', 'package-lock.json', '.github/workflows/windows-build.yml']
  pull_request:
    paths: ['src/**', 'assets/**', 'scripts/**', 'agent/src/**', 'agent/pyproject.toml', 'agent/uv.lock', 'package.json', 'package-lock.json', '.github/workflows/windows-build.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: npm ci --ignore-scripts
      - run: node scripts/vendor.js
      - run: bash scripts/build-agent.sh
        shell: bash
      - run: npx electron-builder --win nsis --x64 --publish never
      # Wie beim Nutzer: still installieren, dann den Agenten aus der Installation prüfen
      # (Selbsttest und Ende-zu-Ende-Test der Brücke mit dem installierten Python).
      - name: Installer testen
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist/Aura-Setup-*.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList '/S' -Wait
          $py = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter python.exe | Where-Object { $_.FullName -like '*resources\python\python.exe' } | Select-Object -First 1
          if (-not $py) { throw 'Installiertes Python nicht gefunden' }
          "Installiert: $($py.FullName)"
          & $py.FullName -I -m aura_agent --selftest
          if ($LASTEXITCODE) { throw 'Selbsttest fehlgeschlagen' }
          $env:AURA_AGENT_PYTHON = $py.FullName
          node --test test/agent2.test.js
          if ($LASTEXITCODE) { throw 'Brücken-Test fehlgeschlagen' }
      # Oberfläche wie beim Nutzer: Eck-Chat (--toggle) und Einstellungen (--settings) öffnen und per
      # DevTools-Protokoll prüfen, dass beide Fenster Antworten vom Hauptprozess bekommen.
      - name: Oberfläche testen (Eck-Chat und Einstellungen)
        shell: pwsh
        run: |
          $exe = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter Aura.exe | Select-Object -First 1
          if (-not $exe) { throw 'Aura.exe nicht gefunden' }
          node scripts/win-ui-smoke.js $exe.FullName
          if ($LASTEXITCODE) { throw 'Oberflächen-Test fehlgeschlagen' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: aura-ui-smoke
          path: aura-smoke/
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Aura-Setup
          path: dist/Aura-Setup-*.exe
          retention-days: 14
