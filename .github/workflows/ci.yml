name: CI
# Tests für Aura: der Python-Agent (agent/) und die JavaScript-Seite inklusive Brücke zum Agenten.
# Läuft auf jedem Branch und jedem Pull Request; release.yml ruft diesen Workflow vor jedem Release auf.
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  agent:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      # Für Desktop-, Medien-, Einstellungs- und AT-SPI-Tests: unsichtbarer Bildschirm, D-Bus, GNOME-Schemata, Papierkorb (gio), GTK 3.
      - run: sudo apt-get update -q && sudo apt-get install -y -q xvfb dbus gsettings-desktop-schemas libglib2.0-bin at-spi2-core python3-gi gir1.2-gtk-3.0 gir1.2-atspi-2.0
        working-directory: .
      - run: uv sync --locked
      - run: uv run ruff check src tests spikes evals
      - run: uv run pytest -q -rs  # -rs: übersprungene Tests mit Grund anzeigen

  # Windows-Backend (Fenster, Startmenü, UI Automation, PowerShell, Papierkorb, Registry) und alle übrigen Tests.
  agent-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      # Wie im Betrieb: Electron startet den Agenten mit PYTHONUTF8=1 (src/agent2/bridge.js).
      - run: uv run pytest -q -rs
        env:
          PYTHONUTF8: "1"

  js:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: npm run check
      # Für den Ende-zu-Ende-Test der Brücke (startet den echten Python-Agenten mit Drehbuch-Modell).
      - run: uv sync --locked
        working-directory: agent
      - run: npm test
