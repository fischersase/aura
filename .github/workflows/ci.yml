name: CI
# Tests für Aura: der Python-Agent (agent/) und die JavaScript-Seite inklusive Brücke zum Agenten.
# Läuft auf jedem Branch und jedem Pull Request; release.yml ruft diesen Workflow vor jedem Release auf.
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  agent:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check src tests spikes
      - run: uv run pytest -q

  js:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: npm run check
      # Für den Ende-zu-Ende-Test der Brücke (startet den echten Python-Agenten mit Drehbuch-Modell).
      - run: uv sync --locked
        working-directory: agent
      - run: npm test
