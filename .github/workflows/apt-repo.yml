name: apt-Paketquelle
# Veröffentlicht die signierte apt-Paketquelle (GitHub Pages) neu aus dem neuesten Release, auf Knopfdruck.
# Normalerweise erledigt das release.yml; dieser Workflow ist für Nachholen und Schlüsselwechsel.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Neuestes Release laden
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(gh release view -R "$GITHUB_REPOSITORY" --json tagName -q .tagName)"
          gh release download "$tag" -R "$GITHUB_REPOSITORY" -p aura_amd64.deb -D dist
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
      - name: Paketquelle bauen und signieren
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
          VERSION: ${{ steps.rel.outputs.version }}
        run: bash scripts/build-apt-repo.sh dist/aura_amd64.deb "$VERSION" site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
