name: Linux-Paket
# Baut das .deb auf Pull Requests (und auf Knopfdruck) und prüft es wie beim Nutzer (AURA-21):
# Installation ohne empfohlene Pakete in frischen Ubuntu- und Debian-Containern, alle Bibliotheken des
# Electron-Programms vorhanden, Selbsttest des gebündelten Agenten, lintian ohne Fehler.
on:
  pull_request:
    paths: ['src/**', 'assets/**', 'scripts/**', 'packaging/**', 'agent/src/**', 'agent/pyproject.toml', 'agent/uv.lock', 'package.json', 'package-lock.json', 'gnome-extension/**', '.github/workflows/linux-package.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: npm ci --ignore-scripts
      - run: node scripts/vendor.js
      - run: umask 022 && bash scripts/build-agent.sh
      - run: npx electron-builder --linux deb --x64 --publish never
      - run: cp dist/*.deb dist/aura_amd64.deb
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deb
          path: dist/aura_amd64.deb
          retention-days: 7

  install:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image: ['ubuntu:24.04', 'ubuntu:22.04', 'debian:13']
    container: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: deb
      - name: Installieren ohne empfohlene Pakete
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends ./aura_amd64.deb
      - name: Alle Bibliotheken vorhanden
        run: |
          missing="$(ldd /opt/Aura/aura | grep 'not found' || true)"
          if [ -n "$missing" ]; then echo "$missing"; exit 1; fi
      - name: Selbsttest des gebündelten Agenten
        run: /opt/Aura/resources/python/bin/python3 -I -m aura_agent --selftest
      - name: Deinstallieren
        run: apt-get purge -y -qq aura-desktop && test ! -e /opt/Aura/aura

  lintian:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container: debian:13
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: deb
      - run: apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq lintian
      - run: lintian --fail-on error aura_amd64.deb
