name: Windows installer upgrade

# Like a user updating Aura on Windows: an older release is installed and running, then the new installer is started
# over it (AURA-114). Measures how long it takes, fails if it hangs (2026-10-13: an update ran ~10 minutes, then
# aborted) and checks that afterwards the new version is the one that runs (the old portable 0.10 kept running).
# Pull requests build the installer from the branch; a manual run can test a published release instead.
on:
  workflow_dispatch:
    inputs:
      to:
        description: Release tag of the new installer (empty = build from this branch)
        default: ''
  pull_request:
    paths:
      - .github/workflows/installer-upgrade.yml
      - packaging/windows/**
      - src/win-autostart.js

permissions:
  contents: read

jobs:
  build:
    if: inputs.to == ''
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - run: npm ci --ignore-scripts
      - run: node scripts/vendor.js
      - run: bash scripts/build-agent.sh
        shell: bash
      - run: npx electron-builder --win nsis --x64 --publish never
      - shell: pwsh
        run: Get-ChildItem dist/Aura-Setup-*.exe | Select-Object -First 1 | Copy-Item -Destination dist/Aura-Setup.exe
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer
          path: dist/Aura-Setup.exe
          retention-days: 3

  upgrade:
    needs: build
    if: always() && (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - from: v0.10.1 # appId local.sebastian.aura (before the rename)
            asset: Aura.exe
          - from: v0.11.0
            asset: Aura-Setup.exe
          - from: v0.11.1 # reinstall of the same version
            asset: Aura-Setup.exe
    env:
      GH_TOKEN: ${{ github.token }}
      FROM: ${{ matrix.from }}
      ASSET: ${{ matrix.asset }}
      TO: ${{ inputs.to }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: inputs.to == ''
        with:
          name: installer
          path: new
      - name: Download the installers
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force old, new | Out-Null
          gh release download $env:FROM -R $env:GITHUB_REPOSITORY -p $env:ASSET -D old
          if ($LASTEXITCODE) { throw 'download failed' }
          if ($env:TO) { gh release download $env:TO -R $env:GITHUB_REPOSITORY -p Aura-Setup.exe -D new }
          if ($LASTEXITCODE) { throw 'download failed' }
      - name: Install the old release and start it
        shell: pwsh
        run: |
          if ($env:ASSET -eq 'Aura.exe') {
            # Up to 0.10.x: portable exe, started from Downloads and registered in autostart like the old app did.
            $dl = "$env:USERPROFILE\Downloads"
            New-Item -ItemType Directory -Force $dl | Out-Null
            Copy-Item "old\Aura.exe" "$dl\Aura.exe"
            $run = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run'
            if (-not (Test-Path $run)) { New-Item $run | Out-Null }
            Set-ItemProperty $run 'electron.app.Aura' "`"$dl\Aura.exe`"
            $exe = Get-Item "$dl\Aura.exe"
          } else {
            $t = Measure-Command { Start-Process "old\$env:ASSET" -ArgumentList '/S' -Wait }
            "old install: $([int]$t.TotalSeconds) s"
            $exe = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter Aura.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $exe) { throw 'old Aura.exe not found' }
          "installed at $($exe.FullName)"
          Start-Process $exe.FullName
          Start-Sleep 25
          Get-CimInstance Win32_Process | Where-Object { $_.Path -like "$env:LOCALAPPDATA\Programs\*" } | Select-Object ProcessId, Name, Path | Format-Table -AutoSize | Out-String -Width 300
      - name: Install the new release over the running one
        shell: pwsh
        run: |
          $sw = [Diagnostics.Stopwatch]::StartNew()
          $p = Start-Process 'new\Aura-Setup.exe' -ArgumentList '/S' -PassThru
          $done = $p.WaitForExit(15 * 60 * 1000)
          "new install: $([int]$sw.Elapsed.TotalSeconds) s, exited: $done, code: $(if ($done) { $p.ExitCode })"
          Get-CimInstance Win32_Process | Where-Object { $_.Path -like "$env:LOCALAPPDATA\Programs\*" -or $_.Name -like '*Setup*' -or $_.Name -like 'Un_*' } | Select-Object ProcessId, Name, Path | Format-Table -AutoSize | Out-String -Width 300
          Get-ChildItem "$env:LOCALAPPDATA\Programs" -Directory | ForEach-Object { "$($_.FullName): $((Get-ChildItem $_.FullName -Recurse -File -ErrorAction SilentlyContinue).Count) files" }
          Get-ChildItem 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall' | ForEach-Object { Get-ItemProperty $_.PSPath } | Where-Object { $_.DisplayName -like '*Aura*' } | Select-Object PSChildName, DisplayName, DisplayVersion, InstallLocation | Format-List | Out-String -Width 300
          if (-not $done) { throw 'installer did not finish within 15 minutes' }
          if ($sw.Elapsed.TotalSeconds -gt 300) { throw "installer took $([int]$sw.Elapsed.TotalSeconds) s (budget 300 s)" }
          $exe = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter Aura.exe | Select-Object -First 1
          "new Aura.exe: $($exe.VersionInfo.ProductVersion) at $($exe.FullName)"
      # The user then opens Aura: the installed version must be the one that runs (2026-10-13: the old portable 0.10
      # kept running and the new one handed over to it).
      - name: The new version is the one that runs
        shell: pwsh
        run: |
          $old = Get-CimInstance Win32_Process -Filter "Name='Aura.exe'" | Where-Object { $_.Path -notlike "$env:LOCALAPPDATA\Programs\*" }
          $old | Select-Object ProcessId, Path | Format-Table -AutoSize | Out-String -Width 300
          $exe = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter Aura.exe | Select-Object -First 1
          Start-Process $exe.FullName
          Start-Sleep 20
          $running = Get-CimInstance Win32_Process -Filter "Name='Aura.exe'"
          $running | Select-Object ProcessId, Path | Format-Table -AutoSize | Out-String -Width 300
          if (-not ($running | Where-Object { $_.Path -eq $exe.FullName })) { throw 'the installed Aura did not stay running' }
          if ($running | Where-Object { $_.Path -ne $exe.FullName }) { throw 'an old Aura is still running' }
