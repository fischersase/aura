name: Windows installer upgrade

# Like a user updating Aura on Windows: an older release is installed and running, then the new installer is started
# over it. Measures how long it takes and fails if it hangs (2026-10-13: an update ran ~10 minutes, then aborted).
on:
  workflow_dispatch:
    inputs:
      to:
        description: Release tag of the new installer
        default: v0.11.1
  pull_request:
    paths:
      - .github/workflows/installer-upgrade.yml

permissions:
  contents: read

jobs:
  upgrade:
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - from: v0.10.1 # appId local.sebastian.aura (before the rename)
            asset: Aura.exe
          - from: v0.11.0
            asset: Aura-Setup.exe
          - from: v0.11.1 # reinstall of the same version
            asset: Aura-Setup.exe
    env:
      GH_TOKEN: ${{ github.token }}
      FROM: ${{ matrix.from }}
      ASSET: ${{ matrix.asset }}
      TO: ${{ inputs.to || 'v0.11.1' }}
    steps:
      - name: Download both installers
        shell: pwsh
        run: |
          New-Item -ItemType Directory old, new | Out-Null
          gh release download $env:FROM -R $env:GITHUB_REPOSITORY -p $env:ASSET -D old
          gh release download $env:TO -R $env:GITHUB_REPOSITORY -p Aura-Setup.exe -D new
          if ($LASTEXITCODE) { throw 'download failed' }
      - name: Install the old release and start it
        shell: pwsh
        run: |
          $t = Measure-Command { Start-Process "old\$env:ASSET" -ArgumentList '/S' -Wait }
          "old install: $([int]$t.TotalSeconds) s"
          $exe = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter Aura.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw 'old Aura.exe not found' }
          "installed at $($exe.FullName)"
          Start-Process $exe.FullName
          Start-Sleep 25
          Get-CimInstance Win32_Process | Where-Object { $_.Path -like "$env:LOCALAPPDATA\Programs\*" } | Select-Object ProcessId, Name, Path | Format-Table -AutoSize | Out-String -Width 300
      - name: Install the new release over the running one
        shell: pwsh
        run: |
          $sw = [Diagnostics.Stopwatch]::StartNew()
          $p = Start-Process 'new\Aura-Setup.exe' -ArgumentList '/S' -PassThru
          $done = $p.WaitForExit(15 * 60 * 1000)
          "new install: $([int]$sw.Elapsed.TotalSeconds) s, exited: $done, code: $(if ($done) { $p.ExitCode })"
          Get-CimInstance Win32_Process | Where-Object { $_.Path -like "$env:LOCALAPPDATA\Programs\*" -or $_.Name -like '*Setup*' -or $_.Name -like 'Un_*' } | Select-Object ProcessId, Name, Path | Format-Table -AutoSize | Out-String -Width 300
          Get-ChildItem "$env:LOCALAPPDATA\Programs" -Directory | ForEach-Object { "$($_.FullName): $((Get-ChildItem $_.FullName -Recurse -File -ErrorAction SilentlyContinue).Count) files" }
          Get-ChildItem 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall' | ForEach-Object { Get-ItemProperty $_.PSPath } | Where-Object { $_.DisplayName -like '*Aura*' } | Select-Object PSChildName, DisplayName, DisplayVersion, InstallLocation | Format-List | Out-String -Width 300
          if (-not $done) { throw 'installer did not finish within 15 minutes' }
          if ($sw.Elapsed.TotalSeconds -gt 300) { throw "installer took $([int]$sw.Elapsed.TotalSeconds) s (budget 300 s)" }
          $exe = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter Aura.exe | Select-Object -First 1
          "new Aura.exe: $($exe.VersionInfo.ProductVersion) at $($exe.FullName)"
