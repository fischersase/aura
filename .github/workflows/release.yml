name: Release
# Baut bei jedem Push auf main die Windows-.exe sowie AppImage und .deb für Linux
# und legt sie im Release v<version> ab.
on:
  push:
    branches: [main]
    paths: ['src/**', 'assets/**', 'scripts/**', 'agent/src/**', 'agent/pyproject.toml', 'agent/uv.lock', 'package.json', 'package-lock.json', '.github/workflows/release.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  # Ohne grüne Tests kein Release.
  tests:
    uses: ./.github/workflows/ci.yml

  windows:
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Ohne Install-Skripte: onnxruntime-node/sharp braucht die App nicht (Whisper läuft im Browser-Teil).
      - run: npm ci --ignore-scripts
      - run: node scripts/vendor.js
      - run: npx electron-builder --win portable --x64 --publish never
      - name: Version und Dateiname
        id: v
        shell: pwsh
        run: |
          Get-ChildItem dist/*-portable.exe | Select-Object -First 1 | Copy-Item -Destination dist/Aura.exe
          $v = (Get-Content package.json | ConvertFrom-Json).version
          "version=$v" >> $env:GITHUB_OUTPUT
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: Aura ${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: dist/Aura.exe

  linux:
    needs: windows # erst wenn das Release existiert, sonst legen beide Jobs es gleichzeitig an
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: astral-sh/setup-uv@v6
      - run: npm ci --ignore-scripts
      - run: node scripts/vendor.js
      # Agent v2: Python-Laufzeit bündeln, Größe prüfen, Selbsttest im fertigen Bündel (docs/adr/0006).
      - run: bash scripts/build-agent.sh
      - run: npx electron-builder --linux AppImage deb --x64 --publish never
      - name: Version und Dateinamen
        id: v
        run: |
          cp dist/*.AppImage dist/Aura-x86_64.AppImage
          cp dist/*.deb dist/aura_amd64.deb
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/Aura-x86_64.AppImage
            dist/aura_amd64.deb
