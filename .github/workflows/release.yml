name: Release
# Baut bei jedem Push auf main die GeminiOverlay.exe und legt sie im Release v<version> ab.
on:
  push:
    branches: [main]
    paths: ['src/**', 'assets/**', 'package.json', 'package-lock.json', '.github/workflows/release.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx electron-builder --win portable --x64 --publish never
      - name: Version und Dateiname
        id: v
        shell: pwsh
        run: |
          Get-ChildItem dist/*-portable.exe | Select-Object -First 1 | Copy-Item -Destination dist/GeminiOverlay.exe
          $v = (Get-Content package.json | ConvertFrom-Json).version
          "version=$v" >> $env:GITHUB_OUTPUT
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: Gemini Overlay ${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: dist/GeminiOverlay.exe
