[project]
name = "aura-agent"
version = "0.1.0"
description = "Aura Agent v2: Laptop-Assistent auf Google ADK (Sidecar der Electron-App)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "dbus-fast>=2.24",
  "google-adk[mcp]==2.11.0",
  "httpx>=0.27,<1",
  "json-repair>=0.30",
  "python-xlib>=0.33",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aura_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
# dbus-fast liest D-Bus-Signaturen aus den String-Annotationen ("s", "a{sv}").
"src/aura_agent/testing/fake_mpris.py" = ["UP037", "F821", "RUF100"]
