[project]
name = "aura-agent"
version = "0.1.0"
description = "Aura Agent v2: Laptop-Assistent auf Google ADK (Sidecar der Electron-App)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "google-adk[mcp]==2.11.0",
  "httpx>=0.27,<1",
  "json-repair>=0.30",
  # Linux: Medien und Fenster unter Wayland (D-Bus), Fenster unter X11.
  "dbus-fast>=2.24; sys_platform == 'linux'",
  "python-xlib>=0.33; sys_platform == 'linux'",
  # Windows: UI Automation und Lautstärke (COM), Mediensteuerung (WinRT), Prozesse.
  "comtypes>=1.4.17; sys_platform == 'win32'",
  "pycaw>=20260927; sys_platform == 'win32'",
  "psutil>=7.2; sys_platform == 'win32'",
  "winrt-runtime>=3.2.1; sys_platform == 'win32'",
  "winrt-Windows.Foundation>=3.2.1; sys_platform == 'win32'",
  "winrt-Windows.Foundation.Collections>=3.2.1; sys_platform == 'win32'",
  "winrt-Windows.Media.Control>=3.2.1; sys_platform == 'win32'",
]

[dependency-groups]
dev = [
  "pyright==1.1.414",
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aura_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
indent-width = 4

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "BLE", "RUF", "SIM", "PT", "ASYNC"]
ignore = [
  "E501",  # line length: the formatter wraps code; long strings and comments are fine
  "RUF001", "RUF002", "RUF003",  # German typography („“, –) in strings and comments is intended
  "S603", "S606", "S607",  # starting processes is the agent's job; the policy classifies every command
  "ASYNC109",  # timeout parameters are part of our tool API; implementations use asyncio.wait_for
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PT018", "ASYNC110"]  # plain asserts, fake credentials and polling are fine in tests
"evals/**" = ["S101", "ASYNC110"]
"spikes/**" = ["S101", "ASYNC240"]
# Helpers that must configure gi/COM before importing the bindings.
"src/aura_agent/platform/uia_helper.py" = ["E402"]
"src/aura_agent/testing/gtk_app.py" = ["E402"]
# dbus-fast liest D-Bus-Signaturen aus den String-Annotationen ("s", "a{sv}").
"src/aura_agent/testing/fake_mpris.py" = ["UP037", "F821", "F722", "RUF100"]
# AT-SPI-Helfer: einzelne kaputte Elemente fremder Programme werden bewusst übersprungen; läuft als Skript mit dem System-Python.
"src/aura_agent/platform/atspi_helper.py" = ["S110", "S112", "EXE001", "BLE001", "RUF100", "E402"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
strict = ["src/aura_agent/policy", "src/aura_agent/harness", "src/aura_agent/rpc"]
