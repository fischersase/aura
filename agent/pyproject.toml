[project]
name = "aura-agent"
version = "0.1.0"
description = "Aura Agent v2: Laptop-Assistent auf Google ADK (Sidecar der Electron-App)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "dbus-fast>=2.24",
  "google-adk==2.11.0",
  "httpx>=0.27,<1",
  "json-repair>=0.30",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aura_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
